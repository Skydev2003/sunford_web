name: UAT checks

on:
  pull_request:
    branches: [Javis1, main]
  push:
    branches: [Javis1, main, NaThong]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uat-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uat-checks:
    name: uat-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Lint and formatting
        run: npm run lint && npm run format:check
      - name: Validate database schema and UAT configuration
        run: npm run db:validate && npm run test:uat && npm run test:catalog
      # Vercel runs the Warehouse-backed build. Type generation only needs the source.
      - name: Generate Next.js route types and check TypeScript
        run: npx --no-install next typegen && npm run typecheck
