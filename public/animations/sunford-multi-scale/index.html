<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUNFORD · Multi-product animation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#25313b;font:14px system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:12px}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:transparent}#models,#poster,#video,model-viewer{position:absolute;inset:0;width:100%;height:100%;display:block;background:transparent}#models{isolation:isolate}model-viewer{pointer-events:none;--poster-color:transparent;--progress-bar-height:0px}#poster,#video{object-fit:contain}[hidden]{display:none!important}nav,#products{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px 4px 0}button{font:inherit;color:inherit;border:1px solid #d5dce3;border-radius:24px;background:#fff;padding:10px 18px;cursor:pointer}button:focus-visible,button:hover{outline:2px solid #a5bac8}#products button{font-size:12px;padding:8px 14px}#products button[aria-pressed=true]{background:#e6eff5;border-color:#85a8bf}.timeline{display:flex;align-items:center;gap:10px;max-width:720px;margin:12px auto 0;padding:0 12px}.timeline input{flex:1;min-width:0;accent-color:#355b75}.timeline output{font-variant-numeric:tabular-nums;font-size:12px;min-width:75px;color:#6b7784}#status{display:block;text-align:center;font-size:12px;color:#6b7784;padding:12px}.checker .stage{background:repeating-conic-gradient(#e7e9ec 0% 25%,#fff 0% 50%) 50%/24px 24px}body.dark{background:#171d24;color:#eef3f7}body.dark button{background:#293440;border-color:#4a5c6d}body.dark #products button[aria-pressed=true]{background:#3a5268}body.dark #status{color:#a8b7c6}body.embed main{max-width:none;padding:0}body.embed nav,body.embed #products,body.embed #status,body.embed .timeline{display:none}body.embed .stage{width:100vw;height:100vh;aspect-ratio:auto}
</style>
<main><div class="stage" aria-label="แอนิเมชันเครื่องชั่ง SUNFORD หลายรุ่น"><div id="models"></div><img id="poster" src="./sunford-multi-scale-poster.png" alt="เครื่องชั่ง SUNFORD"><video id="video" hidden muted loop playsinline preload="metadata" poster="./sunford-multi-scale-poster.png" aria-label="วิดีโอเครื่องชั่งหมุนเปลี่ยนรุ่น"></video></div><nav aria-label="ควบคุมแอนิเมชัน"><button id="play" aria-pressed="true">หยุดชั่วคราว</button><button id="restart">เริ่มใหม่</button><button id="mode" hidden>ดูวิดีโอ</button><button id="background">พื้นหลัง: โปร่งใส</button></nav><div class="timeline"><input id="timeline" type="range" min="0" max="32" step="0.01" value="0" aria-label="ตำแหน่งแอนิเมชัน"><output id="timecode">0.0 / 32.0</output></div><div id="products" aria-label="เลือกรุ่น"></div><small id="status" role="status">กำลังโหลดเครื่องชั่ง…</small></main>
<script type="module" src="./model-viewer.min.js"></script><script type="module" src="./sequence-player.mjs?v=slow-32"></script></html>
